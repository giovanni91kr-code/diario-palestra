<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1052FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-v2.svg" type="image/svg+xml">
<link rel="icon" href="favicon-v2.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icon-v2-180.png">
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<title>Diario Palestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: guscio a una colonna mobile-first, barra in alto, tab in basso; in allenamento le tab lasciano il posto alla barra "Salva" */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E3E7EC; --ink:#131820; --muted:#5A6473; --line:#D2D8E0;
  --accent:#2350E6; --accent-ink:#FFFFFF; --accent-bg:#E0E7FC;
  --up:#11804A; --up-bg:#DAF1E4; --down:#C2362C; --down-bg:#F8E0DD; --eq:#6F7A89; --eq-bg:#E4E8ED;
  --warn:#A86A00; --scrim:rgba(12,16,22,.45); --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#171C23; --surface2:#222933; --ink:#E9EDF2; --muted:#98A2B0; --line:#2A313B;
  --accent:#7090FF; --accent-ink:#0B1020; --accent-bg:#1E2A4D;
  --up:#44C585; --up-bg:#15352A; --down:#F2705F; --down-bg:#3F1F1C; --eq:#9AA4B2; --eq-bg:#262D37;
  --warn:#E5A83E; --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171C23; --surface2:#222933; --ink:#E9EDF2; --muted:#98A2B0; --line:#2A313B;
  --accent:#7090FF; --accent-ink:#0B1020; --accent-bg:#1E2A4D;
  --up:#44C585; --up-bg:#15352A; --down:#F2705F; --down-bg:#3F1F1C; --eq:#9AA4B2; --eq-bg:#262D37;
  --warn:#E5A83E; --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;}

*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:6px calc(128px + env(safe-area-inset-bottom,0px))}
body[data-view="workout"] #app{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}

/* barra superiore */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px 8px}
.brand{white-space:nowrap;font:700 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
.sync{white-space:nowrap;min-width:0;overflow:hidden;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:6px 0}
.sync i,.sync-big i{width:8px;height:8px;border-radius:50%;background:var(--eq);flex:none}
[data-s="synced"] i{background:var(--up)} [data-s="offline"] i{background:var(--warn)} [data-s="connecting"] i{background:var(--accent)}
body[data-view="workout"] .topbar{display:none}

/* tipografia */
.title{font:700 30px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:18px 0 12px;text-wrap:balance}
.eyebrow{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
h2{font:700 20px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.num-font{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* bottoni */
.btn,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;border:1px solid transparent}
.btn{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.big{min-height:54px;white-space:nowrap;font:700 19px var(--f-display);text-transform:uppercase;letter-spacing:.04em;flex:1}
.danger{color:var(--down)}
.armed{background:var(--down)!important;color:#fff!important;border-color:var(--down)!important}
.sm{min-height:38px;padding:0 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px}

/* home */
.week{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-top:6px;box-shadow:var(--shadow)}
.week-n{font:500 17px var(--f-body);margin-top:4px}
.week-n b{font:700 26px var(--f-display)}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:10px;border-radius:5px;background:var(--surface2)}
.dots i.on{background:var(--accent)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--accent);background:var(--accent-bg)}
.resume b{display:block;font-weight:600} .resume small{color:var(--muted);font-size:14px}
.resume-go{font:700 18px var(--f-display);text-transform:uppercase;color:var(--accent);white-space:nowrap}
.plans{display:flex;flex-direction:column;gap:10px}
.plan-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.plan-card.is-next{border-color:var(--accent);border-width:2px;padding:13px}
.plan-letter{flex:none;width:56px;height:56px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font:700 34px/1 var(--f-display)}
.is-next .plan-letter{background:var(--accent);color:var(--accent-ink)}
.plan-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.plan-name{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-ex{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-last{font-size:13px;color:var(--muted)}
.chip{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:6px;background:var(--accent-bg);color:var(--accent)}
.chev{font-size:28px;color:var(--muted);flex:none}

/* allenamento */
.wk-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-16px;padding-inline:12px 16px;border-bottom:1px solid var(--line)}
.back{width:42px;height:42px;border-radius:10px;border:0;background:var(--surface2);font-size:26px;line-height:1;flex:none}
.wk-t{min-width:0;flex:1}
.wk-name{font:700 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border-radius:var(--r);padding:14px 12px 10px;margin-top:12px;box-shadow:var(--shadow);scroll-margin-top:80px;border:1px solid var(--line)}
.ex.complete{border-color:var(--up)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-inline:4px}
.ex-name{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.ex-target{font-size:14px;color:var(--muted);margin-top:2px}
.ex-tools{display:flex;gap:6px;margin:8px 0 0;padding-inline:2px}
.ex-tools button{border:1px solid var(--line);background:var(--bg);border-radius:9px;min-height:36px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink)}
.swap-from{font-size:13px;color:var(--accent);font-weight:600;margin-top:3px}
.ex.skipped{padding:10px 12px 10px 16px;border-style:dashed;box-shadow:none;background:transparent}
.skip-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.skipped .ex-name{font-size:18px;color:var(--muted);text-decoration:line-through}
.pick-list{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.pick-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.pick-item b{font-weight:600;display:block}
.pick-item small{display:block;color:var(--muted);font-size:13px}
.pick-item.cur{border-color:var(--accent);border-width:2px}
select.field,select.pex-name{appearance:auto}
.ex-note{font-size:14px;color:var(--muted);margin:6px 4px 0;font-style:italic}
.last{margin:10px 0 4px;padding:9px 10px;border-radius:10px;background:var(--surface2);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.last b{font:600 17px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.last .lbl{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.last-note{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.hint{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--up-bg);color:var(--up);font-size:14px;font-weight:500}
.hint button{border:0;border-radius:8px;background:var(--up);color:var(--surface);font-weight:700;padding:8px 10px;white-space:nowrap}
.badge{flex:none;font:600 13px/1 var(--f-body);padding:6px 8px;border-radius:8px;white-space:nowrap}
.badge.up{background:var(--up-bg);color:var(--up)} .badge.down{background:var(--down-bg);color:var(--down)}
.badge.eq{background:var(--eq-bg);color:var(--eq)} .badge.new{background:var(--accent-bg);color:var(--accent)}
.badge.pr{background:var(--up);color:var(--surface)}
.sets{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.set-head,.set{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:6px;align-items:center}
.set-head.timed,.set.timed{grid-template-columns:24px 1fr 46px}
.set-head{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.idx{font:700 16px/28px var(--f-display);text-align:center;color:var(--muted);border-radius:7px;height:28px}
.idx.up{background:var(--up-bg);color:var(--up)} .idx.down{background:var(--down-bg);color:var(--down)} .idx.eq{background:var(--eq-bg);color:var(--ink)} .idx.new{background:var(--accent-bg);color:var(--accent)}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:11px;min-width:0;height:48px}
.step button{flex:none;width:34px;height:48px;border:0;background:none;font-size:22px;font-weight:500;color:var(--muted)}
.step button:active{color:var(--ink)}
.num{flex:1;min-width:0;width:100%;height:48px;border:0;background:transparent;text-align:center;font:600 22px var(--f-display);font-variant-numeric:tabular-nums;padding:0}
.num:focus{outline:none;background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent);border-radius:8px}
.set.done .step{background:var(--accent-bg)}
.check{width:46px;height:48px;border-radius:11px;border:2px solid var(--line);background:transparent;font-size:22px;font-weight:700;color:var(--muted)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.tratto{display:block;background:var(--bg);border-radius:12px;padding:8px}
.set.tratto.done{background:var(--accent-bg)}
.tratto-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tratto-h .idx{width:24px}
.tratto-l{flex:1;font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;margin-top:6px}
.flabel{font-weight:600;font-size:15px}
.flabel small{color:var(--muted);font-weight:500;font-size:13px}
.set.tratto.done .step{background:var(--surface)}
.plan-card.free{border-style:dashed}
.plan-card.free .plan-letter{background:transparent;border:2px dashed var(--line);color:var(--accent)}
.ex-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.ex-actions button{border:0;background:none;padding:8px 8px;font-size:14px;font-weight:600;color:var(--muted);border-radius:8px}
.ex-actions button:active{background:var(--surface2)}
.ex-actions .grow{flex:1}
.setstep{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--bg);margin-right:6px}
.setstep span{padding:0 4px 0 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.setstep b{min-width:24px;text-align:center;font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.ex-actions .setstep button{width:42px;height:42px;padding:0;font-size:24px;font-weight:500;color:var(--ink);border-radius:10px}
.note-in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;margin-top:6px;resize:vertical;font-size:15px}
.wk-extra{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* barre fisse in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{background:none;border:0;border-radius:16px;min-height:66px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-bg)}
@media (max-width: 400px){.tabs-in{gap:2px}.tabs button{font-size:13px}}
.tabs svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
body[data-view="workout"] .tabs{display:none}
.wkbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.wkbar-in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px}
.wkbar-c{font:600 15px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wkbar-c b{display:block;font:700 22px/1 var(--f-display);color:var(--ink)}
.rest{position:fixed;left:0;right:0;z-index:21;bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:0 12px 8px}
body[data-view="workout"] .rest{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.rest-in{position:relative;overflow:hidden;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.35;width:0}
.rest-in>*{position:relative}
.rest-l{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.rest-t{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-right:auto;min-width:64px}
.rest button{border:0;border-radius:10px;background:rgba(127,127,127,.28);color:inherit;height:40px;min-width:46px;font-weight:700;font-size:15px}
.rest.over .rest-in{background:var(--up);color:#fff}

/* storico */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;border-radius:9px;background:none;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.month{margin:18px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.date-box{flex:none;width:46px;text-align:center}
.date-box b{display:block;font:700 26px/1 var(--f-display)}
.date-box small{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.item-main{flex:1;min-width:0}
.item-t{font:700 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.item-s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-r{flex:none;text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mini-badges{display:flex;gap:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 20px var(--f-display);text-transform:uppercase;margin-bottom:4px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0}
.panel{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin-bottom:6px;padding-right:40px}
.x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:10px;border:0;background:var(--surface2);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .eyebrow{font-size:11px}
.stat b{display:block;font:700 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.stat b.sm-b{font-size:17px;line-height:1.25}
.stat small{font-size:12px;color:var(--muted)}
.sx:first-child{border-top:0}
.sx{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sx-n{font-weight:600}
.sx-s{font:600 16px var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin:6px 0 2px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.end{fill:var(--accent)}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:17px;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* riepilogo */
.done-hero{text-align:center;padding:24px 0 6px}
.done-hero .tick{width:64px;height:64px;border-radius:50%;background:var(--up);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font:700 34px/1 var(--f-display)}

/* editor schede */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}

<script>
'use strict';
/* =====================================================================
   DIARIO PALESTRA — tutto il codice in un file, diviso in sezioni:
   1. Utilità   2. Schede di esempio   3. Archivio (locale + cloud)
   4. Logica progressione   5. Viste   6. Azioni   7. Timer   8. Avvio
   ===================================================================== */

/* ---------- 1. UTILITÀ ---------- */
const APP_VERSION = '1.9 · 3 ott 2026';   // aggiornala a ogni modifica: la vedi in fondo alla sezione Dati
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const round2 = x => Math.round(x * 100) / 100;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmtNum = n => String(round2(+n || 0)).replace('.', ',');
const parseNum = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const DAY = 86400000;
function fmtDur(ms){ const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function fmtMin(ms){ return Math.max(1, Math.round(ms / 60000)) + ' min'; }
function fmtRest(sec){ return sec < 60 ? sec + 's' : `${Math.floor(sec / 60)}:${pad(sec % 60)}`; }
function fmtClock(ts){ const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts, o = {weekday:'short', day:'numeric', month:'short'}){ return new Date(ts).toLocaleDateString('it-IT', o); }
function dayStart(ts){ const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function relDay(ts){
  const n = Math.round((dayStart(Date.now()) - dayStart(ts)) / DAY);
  if (n <= 0) return 'oggi'; if (n === 1) return 'ieri'; if (n < 7) return `${n} giorni fa`;
  if (n < 30) { const w = Math.round(n / 7); return w === 1 ? '1 settimana fa' : `${w} settimane fa`; }
  return 'il ' + fmtDate(ts, {day:'numeric', month:'short'});
}
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- 2. LIBRERIA ESERCIZI + SCHEDE DI ESEMPIO ----------
   La libreria si modifica anche dall'app (Schede → Libreria esercizi). */
const GROUPS = ['Petto', 'Schiena', 'Spalle', 'Bicipiti', 'Tricipiti', 'Gambe', 'Femorali e glutei', 'Polpacci', 'Addome', 'Cardio', 'Altro'];
const LIB_DEFAULT = {
  'Petto': ['Panca piana bilanciere', 'Panca piana manubri', 'Panca inclinata bilanciere', 'Panca inclinata manubri', 'Chest press', 'Chest press inclinata', 'Croci con manubri', 'Croci ai cavi', 'Pectoral machine', 'Dip alle parallele', 'Piegamenti'],
  'Schiena': ['Lat machine presa larga', 'Lat machine presa stretta', 'Trazioni alla sbarra', 'Trazioni assistite', 'Rematore con bilanciere', 'Rematore con manubrio', 'Pulley basso', 'Rematore alla macchina', 'T-bar row', 'Pullover al cavo', 'Hyperextension', 'Dead hang'],
  'Spalle': ['Military press bilanciere', 'Shoulder press manubri', 'Shoulder press machine', 'Arnold press', 'Alzate laterali', 'Alzate laterali al cavo', 'Alzate posteriori', 'Reverse pec deck', 'Face pull', 'Tirate al mento'],
  'Bicipiti': ['Curl con manubri', 'Curl con bilanciere', 'Curl a martello', 'Curl ai cavi', 'Curl su panca Scott', 'Curl concentrato', 'Curl su panca inclinata'],
  'Tricipiti': ['Push-down ai cavi', 'French press', 'Estensioni sopra la testa al cavo', 'Estensioni con manubrio sopra la testa', 'Kickback', 'Dip alla panca', 'Panca presa stretta'],
  'Gambe': ['Wall sit', 'Squat bilanciere', 'Hack squat', 'Pendulum squat', 'Leg press', 'Leg extension', 'Goblet squat', 'Affondi con manubri', 'Bulgarian split squat', 'Step-up'],
  'Femorali e glutei': ['Stacco rumeno', 'Stacco da terra', 'Leg curl', 'Leg curl seduto', 'Hip thrust', 'Glute bridge', 'Abductor machine', 'Adductor machine', 'Kickback ai cavi'],
  'Polpacci': ['Calf raise in piedi', 'Calf raise seduto', 'Calf alla leg press'],
  'Addome': ['Crunch al cavo', 'Crunch', 'Plank', 'Plank laterale', 'Hollow hold', 'Leg raise', 'Russian twist', 'Ab wheel'],
  'Cardio': ['Tapis roulant', 'Cyclette', 'Ellittica', 'Vogatore', 'Stair climber'],
  'Altro': []
};
const defaultLibrary = () => GROUPS.flatMap(g => LIB_DEFAULT[g].map(name => g === 'Cardio' ? {name, group: g, kind: cardioKind(name)} : {name, group: g}));
const defGroup = name => GROUPS.find(g => LIB_DEFAULT[g].some(n => norm(n) === norm(name))) || 'Altro';
/* Tipi di esercizio: pesi (kg × ripetizioni), tapis roulant (minuti, velocità, inclinazione), altro cardio (minuti, livello) */
const cardioKind = name => /tapis|treadmill/i.test(name) ? 'tapis' : 'cardio';
// Esercizi statici (isometrici): si misurano in secondi
const isTimeName = name => /plank|wall sit|isometric|dead hang|hollow|l-sit|isometri/i.test(name);
const isCardioKind = k => k === 'tapis' || k === 'cardio';
const defKind = name => defGroup(name) === 'Cardio' ? cardioKind(name) : isTimeName(name) ? 'time' : 'strength';
const FIELDS = {
  tapis: [{k: 'min', label: 'Durata', unit: 'min', step: 1, def: 20}, {k: 'v', label: 'Velocità', unit: 'km/h', step: 0.5, def: 6}, {k: 'inc', label: 'Inclinazione', unit: '%', step: 0.5, def: 5, max: 30}],
  cardio: [{k: 'min', label: 'Durata', unit: 'min', step: 1, def: 20}, {k: 'lvl', label: 'Livello', unit: '', step: 1, def: 5}],
  time: [{k: 'sec', label: 'Secondi', unit: 's', step: 5, def: 30}]
};
const isCardio = s => !!s && s.min !== undefined;
const isTime = s => !!s && s.sec !== undefined;

/* ex(nome, serie, repMin, repMax, nota, recupero in secondi, salto peso in kg) */
function ex(name, sets, repMin, repMax, note = '', rest = 90, step = 0.5){ return {id: uid(), name, group: defGroup(name), kind: defKind(name), sets, repMin, repMax, rest, step, note}; }
function defaultPlans(){
  return [
    {id:'A', name:'Giorno A', exercises:[
      ex('Panca piana bilanciere', 4, 6, 8, 'Alt: chest press', 120),
      ex('Rematore con manubrio', 3, 8, 10, 'Peso del singolo manubrio'),
      ex('Leg press', 3, 10, 12, '', 120),
      ex('Alzate laterali', 3, 12, 15, 'Alt: alzate al cavo', 60),
      ex('Curl con manubri', 3, 10, 12, '', 60),
      ex('Crunch al cavo', 3, 12, 15, '', 60)]},
    {id:'B', name:'Giorno B', exercises:[
      ex('Squat bilanciere', 4, 6, 8, 'Alt: hack squat', 150),
      ex('Lat machine presa larga', 3, 8, 10, 'Alt: trazioni assistite'),
      ex('Shoulder press manubri', 3, 8, 10, 'Alt: shoulder press machine'),
      ex('Leg curl', 3, 10, 12, '', 60),
      ex('Push-down ai cavi', 3, 10, 12, 'Corda o barra', 60),
      ex('Plank', 3, 30, 45, '', 60, 0)]},
    {id:'C', name:'Giorno C', exercises:[
      ex('Stacco rumeno', 3, 8, 10, 'Alt: hip thrust', 120),
      ex('Panca inclinata manubri', 3, 8, 10),
      ex('Pulley basso', 3, 10, 12, 'Alt: rematore alla macchina'),
      ex('Affondi con manubri', 3, 10, 12, 'Ripetizioni per gamba'),
      ex('Face pull', 3, 12, 15, '', 60),
      ex('Curl a martello', 3, 10, 12, '', 60)]}
  ];
}

/* ---------- 3. ARCHIVIO ----------
   Ogni modifica va PRIMA nel browser (istantaneo, funziona offline),
   POI nel cloud del tuo account (se disponibile). Una coda "pending"
   ricorda cosa non è ancora arrivato al cloud e lo reinvia appena può. */
let S = LS.get('dp.state', null) || {v:3, plans: defaultPlans(), library: defaultLibrary(), plansUpdatedAt: 0, sessions: [], settings: {rest: 90}};
// Aggiornamento dati dalla versione 1: salto peso 0,5 kg, gruppo muscolare, libreria
function upgradePlans(plans, v){
  plans.forEach(p => p.exercises.forEach(e => { if ((v || 1) < 2 && e.step !== 0) e.step = 0.5; if (!e.group) e.group = groupOf(e.name); }));
  return plans;
}
function groupOf(name){ const f = (S && S.library || []).find(x => norm(x.name) === norm(name)); return f ? f.group : defGroup(name); }
function kindOf(name){ const f = (S && S.library || []).find(x => norm(x.name) === norm(name)); if (f) return f.kind || (f.group === 'Cardio' ? cardioKind(f.name) : isTimeName(f.name) ? 'time' : 'strength'); return defKind(name); }
function ensureCardio(){ if (!S.library.some(x => x.group === 'Cardio')) LIB_DEFAULT.Cardio.forEach(name => S.library.push({name, group: 'Cardio', kind: cardioKind(name)})); }
function ensureInLibrary(name, group){ if (name && !S.library.some(x => norm(x.name) === norm(name))) S.library.push({name, group: group || defGroup(name), custom: true}); }
if (!S.library) S.library = defaultLibrary();
if ((S.v || 1) < 3) { ensureCardio(); if (S.v === 2) { S.v = 3; if (S.plansUpdatedAt) S.plansUpdatedAt = Date.now(); LS.set('dp.state', S); } }
if ((S.v || 1) < 2) {
  upgradePlans(S.plans, 1);
  S.plans.forEach(p => p.exercises.forEach(e => ensureInLibrary(e.name, e.group)));
  S.v = 3; if (S.plansUpdatedAt) S.plansUpdatedAt = Date.now();
  LS.set('dp.state', S);
}
let D = LS.get('dp.draft', null);          // allenamento in corso
let P = LS.get('dp.pending', []);          // chiavi da inviare al cloud
if (D && !D.v) { D.exercises.forEach(e => { if (e.step !== 0) e.step = 0.5; e.group = e.group || groupOf(e.name); }); D.v = 2; }
const persist = () => LS.set('dp.state', S);
const persistDraft = () => D ? LS.set('dp.draft', D) : LS.del('dp.draft');
let draftT; function saveDraftSoon(){ clearTimeout(draftT); draftT = setTimeout(persistDraft, 250); }

const C = {col: null, state: 'local', lastSync: 0, retry: null};
let lock = Promise.resolve();
function serial(fn){ const p = lock.then(fn, fn); lock = p.catch(() => {}); return p; }
function addPending(k){
  if (k.startsWith('del:')) P = P.filter(x => x !== k.slice(4));
  if (!P.includes(k)) P.push(k);
  LS.set('dp.pending', P);
}
function queue(k){ addPending(k); scheduleFlush(); }
let flushT;
function scheduleFlush(){ clearTimeout(flushT); flushT = setTimeout(() => serial(async () => { if (!C.col) return; setSync((await flush()) ? 'synced' : 'offline'); }), 800); }

async function flush(){
  if (!C.col) return false;
  while (P.length) {
    const k = P[0];
    try {
      if (k.startsWith('del:')) await C.col.doc(k.slice(4)).delete();
      else if (k === 'plans') await C.col.doc('plans').set({v: 3, plans: S.plans, library: S.library, settings: S.settings, updatedAt: S.plansUpdatedAt});
      else {
        const s = S.sessions.find(x => 's-' + x.id === k);
        if (s) { const {_synced, ...body} = s; await C.col.doc(k).set({session: body}); s._synced = true; persist(); }
      }
      P.shift(); LS.set('dp.pending', P);
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'transform_error')) { P.shift(); LS.set('dp.pending', P); continue; }
      return false;
    }
  }
  return true;
}

function sync(){ return serial(async () => {
  if (!C.col) return;
  setSync('connecting'); C.lastSync = Date.now();
  try {
    if (!(await flush())) { setSync('offline'); retryLater(); return; }
    const snap = await C.col.limit(1000).get();
    const cloud = new Map(); let plansDoc = null;
    snap.docs.forEach(d => { const b = d.data(); if (!b) return;
      if (d.id === 'plans') plansDoc = b; else if (d.id.startsWith('s-') && b.session) cloud.set(d.id.slice(2), b.session); });
    const merged = [], seen = new Set();
    for (const s of S.sessions) {

/* ---------- 4. LOGICA PROGRESSIONE ----------
   Regola semplice: a parità di peso contano le ripetizioni; se il peso
   cambia si confronta la "forza stimata" (formula di Epley: peso × (1 + reps/30)). */
const e1 = s => s.w > 0 ? s.w * (1 + s.r / 30) : s.r;
const cardioScore = s => s.v !== undefined ? (s.min * s.v / 60) * (1 + (s.inc || 0) / 10) : s.min * (1 + (s.lvl || 0) / 10);
// Valore usato per record e grafico: forza stimata (pesi), km percorsi (tapis), minuti (altro cardio)
const metric = s => isTime(s) ? s.sec : isCardio(s) ? (s.v !== undefined ? s.min * s.v / 60 : s.min) : e1(s);
function setCmp(c, p){
  if (!p || isCardio(c) !== isCardio(p) || isTime(c) !== isTime(p)) return 'new';
  if (isTime(c)) return c.sec > p.sec ? 'up' : c.sec < p.sec ? 'down' : 'eq';
  if (isCardio(c)) {   // cardio: più minuti, velocità, inclinazione o livello = meglio
    let u = 0, d = 0;
    ['min', 'v', 'inc', 'lvl'].forEach(k => { if (c[k] === undefined) return; const a = c[k] || 0, b = p[k] || 0; if (a > b + 1e-9) u++; else if (a < b - 1e-9) d++; });
    if (u && !d) return 'up'; if (d && !u) return 'down'; if (!u && !d) return 'eq';
    const a = cardioScore(c), b = cardioScore(p); return a > b * 1.005 ? 'up' : a < b * 0.995 ? 'down' : 'eq';
  }
  if (Math.abs(c.w - p.w) < 1e-9) return c.r > p.r ? 'up' : c.r < p.r ? 'down' : 'eq';
  if (c.w > p.w && c.r >= p.r) return 'up';
  if (c.w < p.w && c.r <= p.r) return 'down';
  if (c.w > 0 && p.w > 0) { const a = e1(c), b = e1(p); return a > b * 1.005 ? 'up' : a < b * 0.995 ? 'down' : 'eq'; }

}

  cur.forEach((c, j) => { const r = setCmp(c, prev && prev[j]); if (r === 'up') u++; else if (r === 'down') d++; else if (r === 'new') n++; });

    const e = s.exercises.find(x => (exId && x.exId === exId) || norm(x.name) === k);

}
const lastFor = (exId, name, before) => historyFor(exId, name, before)[0] || null;
const fmtCardio = s => [fmtNum(s.min) + ' min', s.v !== undefined ? fmtNum(s.v) + ' km/h' : '', s.inc !== undefined ? 'incl. ' + fmtNum(s.inc) + '%' : '', s.lvl !== undefined ? 'liv. ' + fmtNum(s.lvl) : ''].filter(Boolean).join(' · ');

function chartSvg(pts){
  const W = 320, H = 120, L = 34, R = 10, T = 12, B = 22;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < (hi < 20 ? 0.2 : 1)) { const m = hi < 20 ? 0.2 : 1; lo = Math.max(0, lo - m); hi += m; }
  const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${x(0)},${H - B} ${line} ${x(pts.length - 1)},${H - B}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento forza stimata">
    <line class="grid" x1="${L}" x2="${W - R}" y1="${y(hi)}" y2="${y(hi)}"/><line class="grid" x1="${L}" x2="${W - R}" y1="${y(lo)}" y2="${y(lo)}"/>
    <text x="${L - 6}" y="${y(hi) + 4}" text-anchor="end">${hi < 20 ? fmtNum(Math.round(hi * 10) / 10) : Math.round(hi)}</text><text x="${L - 6}" y="${y(lo) + 4}" text-anchor="end">${lo < 20 ? fmtNum(Math.round(lo * 10) / 10) : Math.round(lo)}</text>
    <polygon class="ar" points="${area}"/><polyline class="ln" points="${line}"/>
    ${pts.map((p, i) => `<circle class="pt${i === pts.length - 1 ? ' end' : ''}" cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join('')}
    <text x="${L}" y="${H - 5}">${fmtDate(pts[0].t, {day:'numeric', month:'short'})}</text>
    <text x="${W - R}" y="${H - 5}" text-anchor="end">${fmtDate(pts[pts.length - 1].t, {day:'numeric', month:'short'})}</text></svg>`;
}

// Prepara le serie precompilate con l'ultima volta (o valori di partenza)
function initSets(last, kind, n, repMin){
  const sets = [];
  for (let k = 0; k < n; k++) {
    let ls = last && (last.sets[k] || last.sets[last.sets.length - 1]);
    if (kind === 'time') { sets.push({sec: ls ? (ls.sec !== undefined ? ls.sec : ls.r !== undefined ? ls.r : 30) : 30, done: false}); continue; }   // i vecchi plank segnati come "ripetizioni = secondi" valgono come secondi
    if (ls && isCardio(ls) !== (kind !== 'strength')) ls = null;
    if (kind === 'strength') sets.push({w: ls ? ls.w : 0, r: ls ? ls.r : repMin, done: false});
    else { const o = {done: false}; FIELDS[kind].forEach(f => o[f.k] = ls && ls[f.k] !== undefined ? ls[f.k] : f.def); sets.push(o); }
  }
  return sets;
}
function draftEx(name, group, tpl){
  const kind = kindOf(name), last = lastFor(null, name);
  const n = isCardioKind(kind) ? (last ? last.sets.length : 1) : kind === 'time' ? (last ? last.sets.length : 3) : tpl && (tpl.kind || 'strength') === 'strength' ? tpl.sets.length : 3;
  return initSets(last, kind, n, tpl && tpl.repMin ? tpl.repMin : 10);
}
function choose(name){
  const group = groupOf(name);

    const e = D.exercises[PK.i]; const orig = e.swappedFrom || e.name;
    e.sets = draftEx(name, group, e); e.kind = kindOf(name);
    if (norm(name) === norm(orig)) { delete e.swappedFrom; e.exId = e.origExId || e.exId; e.planNote = e.origNote || ''; }
    else { e.swappedFrom = orig; e.origExId = e.origExId || e.exId; e.origNote = e.origNote ?? e.planNote; e.exId = null; e.planNote = ''; }
    e.name = name; e.group = group; e.bumped = false;

  } else if (PK.mode === 'extra') {

function startWorkout(pid){
  const p = pid === 'free' ? {id: 'free', name: 'Allenamento libero', exercises: []} : planById(pid); if (!p) return;
  if (D && D.planId !== pid) return sheet(`<h2>Hai un allenamento in corso</h2><p class="muted">${esc(D.planName)}, iniziato alle ${fmtClock(D.start)} con ${doneCount(D)} serie fatte.</p>

  if (!D) {
    if (!p.exercises.length && pid !== 'free') { toast('Aggiungi prima qualche esercizio a questa scheda'); editPlanId = p.id; view = 'plans'; return render(); }
    D = {planId: p.id, planName: p.name, start: Date.now(), exercises: p.exercises.map(e => {
      const kind = kindOf(e.name), sets = initSets(lastFor(e.id, e.name), kind, e.sets, e.repMin);
      return {exId: e.id, name: e.name, group: e.group || groupOf(e.name), kind, ss: !!e.ss, repMin: e.repMin, repMax: e.repMax, rest: e.rest, step: e.step, planNote: e.note, note: '', sets};
    })};
    persistDraft();
  }
  closeSheet(); view = 'workout'; render(); window.scrollTo(0, 0); wake();
  if (pid === 'free' && !D.exercises.length) openPicker('extra', -1, 'Petto');
}
function setWeight(i, j, v){
  const e = D.exercises[i], old = e.sets[j].w; e.sets[j].w = v;
  for (let k = j + 1; k < e.sets.length; k++) if (!e.sets[k].done && e.sets[k].w === old) e.sets[k].w = v; // propaga alle serie successive
}
function adjust(i, j, f, dir){
  const e = D.exercises[i], s = e.sets[j];
  if (f === 'w') setWeight(i, j, Math.max(0, round2(s.w + dir * (e.step || 1))));
  else if (f === 'r') s.r = clamp(s.r + dir, 0, 999);
  else { const fd = (FIELDS[e.kind] || []).find(x => x.k === f) || {step: 1}; s[f] = clamp(round2((s[f] || 0) + dir * fd.step), 0, fd.max || 999); }
  persistDraft(); refreshCard(i);
}
function saveWorkout(mode){
  const s = {id: uid(), planId: D.planId, planName: D.planName, start: D.start, end: Date.now(),
    skipped: D.exercises.filter(e => e.skipped).map(e => e.name),
    exercises: D.exercises.filter(e => !e.skipped).map(e => ({exId: e.exId, name: e.name, group: e.group, ss: e.ss || undefined, swappedFrom: e.swappedFrom || undefined, repMin: e.repMin, repMax: e.repMax, note: e.note.trim(),
      sets: e.sets.filter(x => (mode === 'all' || x.done) && (isCardio(x) ? x.min > 0 : isTime(x) ? x.sec > 0 : x.r > 0)).map(({done, ...x}) => x)})).filter(e => e.sets.length)};
  if (!s.exercises.length) { closeSheet(); return toast(D.exercises.length ? 'Nessuna serie da salvare' : 'Aggiungi almeno un esercizio'); }
  const items = s.exercises.map(e => {
    const hist = historyFor(e.exId, e.name), prev = hist[0];
    const prevBest = hist.length ? Math.max(...hist.flatMap(h => h.sets.map(metric))) : 0;
    return {name: e.name, sets: e.sets, prev: prev && prev.sets, c: prev ? cmpSets(e.sets, prev.sets) : 'new', pr: hist.length > 0 && Math.max(...e.sets.map(metric)) > prevBest * 1.001};
  });
  lastSummary = {sid: s.id, planName: s.planName, start: s.start, dur: s.end - s.start, items,
    nSets: s.exercises.reduce((a, e) => a + e.sets.length, 0), vol: s.exercises.reduce((a, e) => a + volume(e.sets), 0),
    ups: items.filter(x => x.c === 'up').length, prs: items.filter(x => x.pr).length};
  S.sessions.push(s); S.sessions.sort((a, b) => a.start - b.start); persist(); queue('s-' + s.id);
  D = null; persistDraft(); unwake(); stopRest(); closeSheet();
  view = 'summary'; render(); window.scrollTo(0, 0);
}

async function download(filename, text, mime){
  let dl = null;
  try { if (window.claude && typeof claude.use === 'function') dl = await claude.use('downloads'); } catch (e) {}
  if (dl) { try { await dl.save({filename, data: text}); toast('File pronto'); } catch (e) { if (!e || e.code !== 'declined') toast('Download non disponibile qui'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: mime})); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const csvCell = v => { v = String(v ?? ''); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

  for (const s of S.sessions) for (const e of s.exercises) e.sets.forEach((x, k) => rows.push([
    fmtDate(s.start, {day:'2-digit', month:'2-digit', year:'numeric'}), fmtClock(s.start), s.planName, e.name, k + 1, isCardio(x) || isTime(x) ? '' : fmtNum(x.w), isCardio(x) || isTime(x) ? '' : x.r, isCardio(x) || isTime(x) ? '' : fmtNum(x.w * x.r), isTime(x) ? x.sec : '', isCardio(x) ? fmtNum(x.min) : '', x.v !== undefined ? fmtNum(x.v) : '', x.inc !== undefined ? fmtNum(x.inc) : '', x.lvl !== undefined ? fmtNum(x.lvl) : '', Math.round((s.end - s.start) / 60000), k === 0 ? e.note || '' : '']));

const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
async function importFile(file){
  try {
    const j = JSON.parse(await file.text());

    const have = new Set(S.sessions.map(s => s.id)); let n = 0;
    for (const s of j.sessions) {

      S.sessions.push({id: String(s.id), planId: s.planId, planName: String(s.planName || 'Allenamento'), start: +s.start, end: +s.end || +s.start,
        exercises: s.exercises.map(e => ({exId: e.exId, name: String(e.name || ''), group: e.group, swappedFrom: e.swappedFrom, repMin: e.repMin, repMax: e.repMax, note: e.note || '',

      addPending('s-' + s.id); n++;

    S.sessions.sort((a, b) => a.start - b.start);
    if (Array.isArray(j.plans) && j.plans.length) { S.plans = j.plans; S.plansUpdatedAt = Date.now(); addPending('plans'); }

  'ex-del': b => { const p = planById(editPlanId); p.exercises.splice(+b.closest('.pex').dataset.k, 1); markPlansDirty(); render(); },
  'ex-up': b => movePex(+b.closest('.pex').dataset.k, -1), 'ex-down': b => movePex(+b.closest('.pex').dataset.k, 1),
  'ef-': b => stepField(b, -1), 'ef+': b => stepField(b, 1),
  'export-csv': () => S.sessions.length ? download(`diario-palestra-${stamp()}.csv`, toCSV(), 'text/csv') : toast('Nessun allenamento da esportare'),
  'export-json': () => download(`diario-palestra-backup-${stamp()}.json`, JSON.stringify({app: 'diario-palestra', v: 1, exportedAt: new Date().toISOString(), plans: S.plans, settings: S.settings, sessions: S.sessions.map(({_synced, ...s}) => s)}, null, 1), 'application/json'),
  'sync-now': () => sync(),
  'reset-plans': () => { S.plans = defaultPlans(); editPlanId = null; markPlansDirty(); render(); toast('Schede di esempio ripristinate'); },
};
function movePex(k, dir){ const a = planById(editPlanId).exercises, t = k + dir; if (t < 0 || t >= a.length) return; [a[k], a[t]] = [a[t], a[k]]; markPlansDirty(); render(); }
function stepField(b, dir){
  const k = +b.closest('.pex').dataset.k, e = planById(editPlanId).exercises[k], f = b.dataset.f;
  if (f === 'sets') e.sets = clamp(e.sets + dir, 1, 10);
  if (f === 'repMin') { e.repMin = clamp(e.repMin + dir, 1, 99); if (e.repMax < e.repMin) e.repMax = e.repMin; }
  if (f === 'repMax') { e.repMax = clamp(e.repMax + dir, 1, 99); if (e.repMin > e.repMax) e.repMin = e.repMax; }
  if (f === 'rest') e.rest = clamp(e.rest + dir * 15, 0, 600);
  if (f === 'step') { const L = [0, 0.5, 1, 1.25, 2, 2.5, 5, 10]; let ix = L.indexOf(e.step); if (ix < 0) ix = 1; e.step = L[clamp(ix + dir, 0, L.length - 1)]; }
  markPlansDirty(); refreshPex(k);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  if (b.dataset.confirm && !b.dataset.armed) {            // conferma a due tocchi
    b.dataset.armed = '1'; b.dataset.label = b.textContent; b.textContent = b.dataset.confirm; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.textContent = b.dataset.label; b.classList.remove('armed'); } }, 4000);
    return;
  }
  const exEl = b.closest('.ex'), setEl = b.closest('.set');
  const fn = ACT[b.dataset.a]; if (fn) fn(b, exEl ? +exEl.dataset.i : -1, setEl ? +setEl.dataset.s : -1);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.closest('.ex') && t.dataset.f && D) {
    const i = +t.closest('.ex').dataset.i, e = D.exercises[i];
    if (t.dataset.f === 'note') { e.note = t.value; return saveDraftSoon(); }
    const j = +t.closest('.set').dataset.s;
    if (t.dataset.f === 'w') setWeight(i, j, Math.max(0, round2(parseNum(t.value)))); else if (t.dataset.f === 'r') e.sets[j].r = clamp(Math.round(parseNum(t.value)), 0, 999); else e.sets[j][t.dataset.f] = Math.max(0, round2(parseNum(t.value)));
    return saveDraftSoon();
  }
  if (t.dataset.pf === 'name') { planById(editPlanId).name = t.value; return markPlansDirty(); }
  if (t.id === 'pick-q') { PK.q = t.value; $('#pick-list').innerHTML = pickListHtml(); document.querySelectorAll('#pick-groups button').forEach(x => x.setAttribute('aria-pressed', !PK.q && x.dataset.g === PK.group)); return; }
  if (t.dataset.ef && t.tagName !== 'SELECT') { const e = planById(editPlanId).exercises[+t.closest('.pex').dataset.k]; e[t.dataset.ef] = t.value; markPlansDirty(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'imp' && t.files && t.files[0]) return importFile(t.files[0]);
  if (t.tagName === 'SELECT' && t.dataset.ef === 'name') {
    const k = +t.closest('.pex').dataset.k, e = planById(editPlanId).exercises[k];
    if (t.value === '__new') { refreshPex(k); return openPicker('plan-set', k, e.group || 'Petto', true); }
    e.name = t.value; e.group = groupOf(t.value); e.kind = kindOf(t.value); if (isCardioKind(e.kind)) e.sets = 1; e.id = uid(); markPlansDirty(); refreshPex(k); return;
  }
  if (t.classList.contains('num') && t.closest('.ex')) { persistDraft(); refreshCard(+t.closest('.ex').dataset.i); }
  if (t.dataset.pf === 'name' && !t.value.trim()) { planById(editPlanId).name = 'Scheda'; markPlansDirty(); render(); }
});
document.addEventListener('focusin', ev => { if (ev.target.classList && ev.target.classList.contains('num')) setTimeout(() => { try { ev.target.select(); } catch (e) {} }, 0); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('num')) ev.target.blur();
  if (ev.key === 'Enter' && ev.target.id === 'new-name') ACT['pick-new-ok']();
  if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet();
});

/* ---------- 7. VIBRAZIONE E SCHERMO ACCESO ---------- */
let WL = null;
function ensureAudio(){}
function vib(p){ try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function stopRest(){}
async function wake(){ try { if ('wakeLock' in navigator && D && view === 'workout' && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => WL = null); } } catch (e) { WL = null; } }
function unwake(){ try { WL && WL.release(); } catch (e) {} WL = null; }

/* ---- Azioni account (versione Firebase) ---- */
Object.assign(ACT, {
  'gate-mode': b => { gateMode = b.dataset.m; renderGate(); const f = $('#au-email'); if (f && !f.value) f.focus(); },
  logout: async () => {
    if (P.length) { toast('Aspetta la sincronizzazione (serve internet), poi esci'); sync(); return; }
    if (D) { toast('Chiudi o annulla prima l\'allenamento in corso'); return; }
    await FB.auth.signOut(); resetLocal(); LS.del('dp.owner'); view = 'home'; render();
  }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- 8. AVVIO ---------- */
setInterval(() => { const el = $('#elapsed'); if (el && D) el.textContent = fmtDur(Date.now() - D.start); }, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  wake();
  if (C.col && Date.now() - C.lastSync > 20000) sync();
});
window.addEventListener('online', () => sync());
// Correzione: esercizi cardio (es. tapis roulant) scelti dal menu prima della v1.6 risultavano "a pesi"
function fixKinds(){
  let changed = false;
  S.plans.forEach(p => p.exercises.forEach(e => { const k = kindOf(e.name); if ((e.kind || 'strength') !== k) { e.kind = k; if (isCardioKind(k)) e.sets = 1; if (k === 'time' && e.note === 'Ripetizioni = secondi') e.note = ''; changed = true; } }));
  // vecchi plank & co. salvati come "ripetizioni = secondi": diventano secondi veri
  S.sessions.forEach(ss => { let mod = false; ss.exercises.forEach(e => { if (kindOf(e.name) === 'time' && e.sets.length && e.sets.every(x => x.sec === undefined && x.r !== undefined && !x.w)) { e.sets = e.sets.map(x => ({sec: x.r})); mod = true; } }); if (mod) { if (ss._synced) addPending('s-' + ss.id); changed = true; } });
  if (D) D.exercises.forEach(e => { const k = kindOf(e.name); if ((e.kind || 'strength') !== k && !e.sets.some(x => x.done)) { e.kind = k; e.sets = initSets(lastFor(null, e.name), k, isCardioKind(k) ? 1 : Math.max(1, e.sets.length), e.repMin || 10); } });
  return changed;
}
if (fixKinds()) { persist(); if (S.plansUpdatedAt) markPlansDirty(); else scheduleFlush(); }
persistDraft();
if (D) view = 'workout';
render();
if (LS.get('dp.owner', null)) hideGate();
cloudInit();
</script>
